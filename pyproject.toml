[build-system]
requires = ["setuptools >= 84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "3DToLD"
authors = [{name = "Nexusnui", email = "developer@nexusnui.de"}]
description = "This is a graphical Python program for converting various 3D file formats(stl,3mf,obj,stp, etc.) to the LDraw file format (.dat)."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">= 3.12"
license = "GPL-3.0 AND MIT"
license-files =["LICENSE", "colorpicker/LICENSE","ThreeDToLD/ui_elements/js-libraries/LICENSE"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: End Users/Desktop',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: JavaScript',
    'Natural Language :: English',
    'Topic :: File Formats',
    'Topic :: Multimedia :: Graphics :: 3D Modeling'
]
# For Snapshots change dev status to : 'Development Status :: 4 - Beta'
dependencies = [
  "numpy==2.5.4",
  "cascadio==0.1.1",
  "charset-normalizer==3.5.2",
  "lxml==6.1.3",
  "manifold3d==3.5.4",
  "meshio==5.3.5",
  "networkx==3.7",
  "pillow==13.0.0",
  "pycollada==0.9.3",
  "PyQt6==6.12.0",
  "PyQt6-WebEngine==6.140.0",
  "scipy==1.18.1",
  "trimesh==5.2.0",
  "platformdirs==4.14.2",
  "tomlkit==0.15.2",
  "pyqtdarktheme-fork==2.3.6"
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Nexusnui/3DToLD.git"
Issues = "https://github.com/Nexusnui/3DToLD/issues"

[project.gui-scripts]
3DToLD = "ThreeDToLD.app:run"

[tool.setuptools.dynamic]
version = {attr = "ThreeDToLD._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ThreeDToLD*", "colorpicker*"]

[tool.setuptools.package-data]
"ThreeDToLD.brick_data" = ['colour_definitions.csv']
"ThreeDToLD.icons" = [
    '3DToLD_icon.ico',
    '3DToLD_icon*.png',
    'reload-icon.svg',
    'loading_animation.webm',
    'Loading_Symbol.png'
]
"ThreeDToLD.ui_elements" = ['viewer_template.html']
"ThreeDToLD.ui_elements.js-libraries" = ['*']
"ThreeDToLD" =  ['default_config.toml']
